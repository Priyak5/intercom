{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Error{% endblock %} — Support</title>
  <style>
    body { font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; color: #111; background: #f7f8fa; margin: 0; }
    main { max-width: 560px; margin: 12vh auto; padding: 40px 32px; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .code { display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: #666; margin-bottom: 24px; }
    p { color: #444; margin: 0 0 20px; }
    a { color: #0b5cff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="code">{% block code %}Error{% endblock %}</div>
    <h1>{% block heading %}Something went wrong{% endblock %}</h1>
    <p>{% block body %}{% endblock %}</p>
    <p><a href="/">← Back to home</a></p>
  </main>
</body>
</html>
